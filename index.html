<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>临窗书房 · 5m×6m 软装方案效果图</title>
<style>
  :root{
    --ink:#3a2f24; --cream:#f6f0e2; --line:rgba(58,47,36,.22);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#141009;
    font-family:"Songti SC","STSong","Noto Serif SC",serif;color:var(--ink)}
  #stage{position:fixed;inset:0}
  canvas{display:block}

  /* 暗角 */
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(20,14,8,.28) 100%)}

  .card{position:fixed;z-index:10;background:rgba(246,240,226,.92);
    border:1px solid var(--line);border-radius:14px;
    box-shadow:0 8px 32px rgba(15,10,4,.35);backdrop-filter:blur(6px)}

  #titleCard{top:22px;left:22px;padding:16px 20px 14px;max-width:330px}
  #titleCard h1{font-size:21px;letter-spacing:.12em;font-weight:700}
  #titleCard .sub{font-size:11.5px;margin-top:6px;color:#7a6a52;letter-spacing:.06em;line-height:1.7}
  #titleCard .sub b{color:var(--ink);font-weight:700}
  .tagrow{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .tag{font-size:10px;padding:3px 8px;border:1px solid var(--line);border-radius:99px;color:#5c4d38;background:rgba(255,255,255,.45)}

  #ctrlCard{top:22px;right:22px;padding:13px 15px;width:196px}
  .grp{margin-bottom:11px}
  .grp:last-child{margin-bottom:0}
  .grp .lab{font-size:10px;letter-spacing:.28em;color:#8a7761;margin-bottom:6px;padding-left:2px}
  .btns{display:flex;gap:5px;flex-wrap:wrap}
  button.pill{font-family:inherit;font-size:11.5px;letter-spacing:.08em;cursor:pointer;
    padding:5px 10px;border-radius:99px;border:1px solid var(--line);
    background:transparent;color:var(--ink);transition:all .18s}
  button.pill:hover{background:rgba(58,47,36,.08)}
  button.pill.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}

  #viewBar{bottom:24px;left:50%;transform:translateX(-50%);padding:9px 12px;display:flex;gap:5px;align-items:center}
  #viewBar .sep{width:1px;height:16px;background:var(--line);margin:0 3px}
  #hint{position:fixed;bottom:26px;right:24px;z-index:10;font-size:10.5px;letter-spacing:.14em;
    color:rgba(246,240,226,.55);text-shadow:0 1px 4px rgba(0,0,0,.5)}

  /* 点击软装清单弹层 */
  #popCard{position:fixed;z-index:20;width:262px;padding:13px 15px 12px;display:none}
  #popCard.show{display:block;animation:popin .22s ease-out}
  @keyframes popin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  #popCard h3{font-size:15px;letter-spacing:.1em;border-bottom:1px solid var(--line);
    padding-bottom:7px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  #popCard .x{cursor:pointer;font-family:sans-serif;font-size:14px;color:#8a7761;
    width:20px;height:20px;line-height:19px;text-align:center;border-radius:50%;border:1px solid var(--line)}
  #popCard .x:hover{background:rgba(58,47,36,.08)}
  #popCard dl{font-size:11.5px;line-height:1.75;color:#4c4032}
  #popCard dt{float:left;clear:left;width:44px;color:#94805f;letter-spacing:.05em}
  #popCard dd{margin-left:52px}
  #popCard dd b{color:#8f3b2b}
  #popCard .tip{margin-top:7px;font-size:10.5px;color:#7a6a52;background:rgba(200,135,31,.12);
    border-left:2px solid #c8871f;padding:5px 8px;line-height:1.6}
  .taglab{position:absolute;transform:translate(-50%,-50%);background:rgba(246,240,226,.95);
    border:1.5px solid #c8402a;border-radius:12px;padding:3px 11px;font-family:"Songti SC","STSong",serif;
    font-size:12px;font-weight:700;color:#3a2f24;letter-spacing:.06em;white-space:nowrap;
    box-shadow:0 2px 10px rgba(15,10,4,.35)}
  .ping{position:fixed;z-index:18;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
    border:2px solid #c8402a;pointer-events:none;animation:ping .7s ease-out forwards}
  @keyframes ping{from{transform:scale(.4);opacity:.95}to{transform:scale(1.6);opacity:0}}

  #loading{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:#181209;color:rgba(246,240,226,.75);font-size:13px;letter-spacing:.35em;
    transition:opacity .8s}
  #loading.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="loading">布 光 中 …</div>
<div id="stage"></div>
<div class="vignette"></div>

<div class="card" id="titleCard">
  <h1>临窗书房</h1>
  <div class="sub">软装方案效果图 &nbsp;·&nbsp; <b>5.0m × 6.0m</b>　层高 2.8m<br>朝南凸窗采光 &nbsp;·&nbsp; 西墙整面书架 &nbsp;·&nbsp; 临窗书桌</div>
  <div class="tagrow">
    <span class="tag">复古暖木</span><span class="tag">阅读坐榻</span><span class="tag">整墙藏书</span><span class="tag">治愈系</span>

  <div class="grp"><div class="lab">光 线</div>
    <div class="btns" id="timeBtns">
      <button class="pill on" data-t="day">白 昼</button>
      <button class="pill" data-t="dusk">暮 色</button>

    <dt>规格</dt><dd id="pcSpec">—</dd>

    <dt>参考价</dt><dd id="pcPrice"><b>—</b></dd>
  </dl>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ================= 基础 ================= */
const ROOM_W = 5.0, ROOM_D = 6.0, ROOM_H = 2.8;   // x: 西→东  z: 南→北
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, .05, 80);
camera.position.set(6.2, 3.1, 7.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(2.45, 1.08, 2.0);
controls.enableDamping = true; controls.dampingFactor = .07;
controls.maxPolarAngle = Math.PI*0.495;
controls.minDistance = 0.9; controls.maxDistance = 13;

/* ================= 调色板（三套风格） ================= */
function mkMat(c,o={}){ return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.86},o)); }

const SW = { wall:mkMat('#ece3d1'), trim:mkMat('#f2ecdd',{roughness:.9}),
  ceil:mkMat('#f4efe3'), floor:mkMat('#ffffff',{roughness:.72}),
  shelf:mkMat('#6f4e2e',{roughness:.66}), backP:mkMat('#5a3d23'),
  deskW:mkMat('#8a5a33',{roughness:.6}), leather:mkMat('#96522b',{roughness:.5}),
  cushion:mkMat('#caa06a',{roughness:.95}), throwM:mkMat('#b3562f',{roughness:.98}),
  rug:mkMat('#a34f2f',{roughness:.97}), rugS:mkMat('#e6dabd',{roughness:.97}),
  pil:[mkMat('#c8871f'),mkMat('#7d3b25'),mkMat('#31584a')],
  baySeat:mkMat('#8a5f36',{roughness:.7}), frame:mkMat('#efe8d8') };

const PALETTES = {
 A:{wall:'#ece3d1',trim:'#f2ecdd',ceil:'#f4efe3',floor:'#9a6a42',
    shelf:'#6f4e2e',backP:'#57391f',desk:'#8a5a33',leather:'#96522b',
    cushion:'#caa06a',throw:'#b3562f',rug:'#a34f2f',rugInk:'#efe3c8',
    pillows:['#c8871f','#7d3b25','#31584a'],baySeat:'#8a5f36',rugS:'#caa06a'},
 B:{wall:'#f2ead9',trim:'#faf5ea',ceil:'#f8f3e7',floor:'#c39a69',
    shelf:'#b78857',backP:'#a17244',desk:'#b98a5c',leather:'#bb8250',
    cushion:'#eee2cb',throw:'#d9b98c',rug:'#ded0b4',rugInk:'#a9784b',
    pillows:['#e5d3ae','#b98a5c','#93a687'],baySeat:'#bd9260',rugS:'#e2d2b0'},
 C:{wall:'#e6dfd0',trim:'#efe9da',ceil:'#f1ece0',floor:'#6f4e33',
    shelf:'#503a28',backP:'#26483e',desk:'#5f4630',leather:'#2e5145',
    cushion:'#d8c9a8',throw:'#c9a136',rug:'#83362b',rugInk:'#caa96a',
    pillows:['#c9972c','#e8dcc4','#83362b'],baySeat:'#4e3826',rugS:'#b08a5e'} };

/* ================= 程序化纹理 ================= */
function canvasTex(w,h,fn){ const c=document.createElement('canvas'); c.width=w;c.height=h;
  fn(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }

let floorTex;
function drawFloor(base){
  if(floorTex) floorTex.dispose();
  floorTex = canvasTex(512,512,(g,w,h)=>{
    g.fillStyle=base; g.fillRect(0,0,w,h);
    const pw=h/8;                                    // 横向拼板
    for(let i=0;i<8;i++){ const y=i*pw;
      g.fillStyle='rgba(0,0,0,'+(0.05+Math.random()*0.07)+')'; g.fillRect(0,y,w,pw-2);
      for(let k=0;k<26;k++){ // 木纹
        g.strokeStyle='rgba('+(Math.random()<.5?'60,38,18':'225,190,140')+','+(0.05+Math.random()*0.09)+')';
        g.lineWidth=1+Math.random(); g.beginPath();
        const yy=y+Math.random()*pw; g.moveTo(0,yy);
        g.bezierCurveTo(w*.3,yy+rnd(-4,4),w*.6,yy+rnd(-4,4),w,yy+rnd(-3,3)); g.stroke(); }
      g.fillStyle='rgba(30,18,8,.85)'; g.fillRect(0,y+pw-2,w,2);
      // 板缝竖线
      let x=Math.random()*w; while(x<w){ g.fillRect(x,y,2,pw-2); x+=160+Math.random()*220; } }
  });
  floorTex.wrapS=floorTex.wrapT=THREE.RepeatWrapping; floorTex.repeat.set(2.6,3.1);
  SW.floor.map=floorTex; SW.floor.needsUpdate=true;
}

let rugTexDay;
function drawRug(main,ink){
  if(rugTexDay) rugTexDay.dispose();
  rugTexDay = canvasTex(640,452,(g,w,h)=>{
    g.fillStyle=main; g.fillRect(0,0,w,h);
    // 做旧杂色
    for(let i=0;i<2600;i++){ g.fillStyle='rgba('+rndi(0,255)+','+rndi(40,120)+','+rndi(0,80)+',.03)';
      g.fillRect(Math.random()*w,Math.random()*h,2,2); }
    // 边框
    g.strokeStyle=ink; g.lineWidth=10; g.strokeRect(20,14,w-40,h-28);
    g.strokeStyle=ink; g.lineWidth=3;  g.strokeRect(42,34,w-84,h-68);
    // 中央菱格暗纹
    g.save(); g.globalAlpha=.5; g.strokeStyle=ink; g.lineWidth=2;
    const cx=w/2, cy=h/2;
    for(let r=54;r<210;r+=52){ g.beginPath();
      g.moveTo(cx,cy-r);g.lineTo(cx+r*1.5,cy);g.lineTo(cx,cy+r);g.lineTo(cx-r*1.5,cy);g.closePath();g.stroke(); }
    g.beginPath(); g.arc(cx,cy,17,0,7); g.stroke();
    // 四角花饰
    [[64,56],[w-64,56],[64,h-56],[w-64,h-56]].forEach(p=>{
      g.beginPath(); g.arc(p[0],p[1],13,0,7); g.stroke();
      g.beginPath(); g.arc(p[0],p[1],5,0,7); g.fillStyle=ink; g.fill(); });
    g.restore();
  });
  SW.rug.map=rugTexDay; SW.rug.needsUpdate=true;
}

/* 天空/暮色/夜 背景 */
function gradTex(stops){
  return canvasTex(16,256,(g,w,h)=>{ const gr=g.createLinearGradient(0,0,0,h);
    stops.forEach(s=>gr.addColorStop(s[0],s[1])); g.fillStyle=gr; g.fillRect(0,0,w,h); });
}
const BG = {
  day:   gradTex([[0,'#8fc3ea'],[.55,'#cfe4ee'],[.8,'#ffe9c4'],[1,'#ffd9a0']]),
  dusk:  gradTex([[0,'#27355c'],[.38,'#54507f'],[.52,'#a25a48'],[.62,'#e08b50'],[.74,'#f2a45e'],[1,'#f7bc72']]),
  night: gradTex([[0,'#0c1428'],[.6,'#16203c'],[1,'#233250']]) };
scene.background = BG.day;

/* 窗外景 */
function makeOutside(){
  const gp = new THREE.Mesh(new THREE.PlaneGeometry(60,40), mat0('#93a578',{roughness:1}));
  gp.rotation.x=-Math.PI/2; gp.position.set(2,-0.02,-11); gp.receiveShadow=true; scene.add(gp);
  // 远处树影团簇
  const spots=[[-3,-6.5,1],[1.5,-9,1.6],[6.5,-7,1.2],[-1,-12,2],[9,-11,1.8],[-6.5,-9,1.5]];
  spots.forEach(s=>{ const tr=new THREE.Group();
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.08*s[2],.12*s[2],1.6*s[2]),mat0('#5d4630'));
    trunk.position.y=.8*s[2]; tr.add(trunk);
    for(let i=0;i<3;i++){ const f=new THREE.Mesh(new THREE.SphereGeometry((0.75+i*0.28)*s[2],7,7),
      mat0(i%2?'#6f8757':'#7c9160',{roughness:1}));
      f.position.set(rnd(-.4,.4),(1.7+i*.45)*s[2],rnd(-.4,.4)); tr.add(f); }
    tr.position.set(s[0],0,s[1]); scene.add(tr); });
}
function mat0(c,o={}){return new THREE.MeshStandardMaterial(Object.assign({color:c},o));}

/* ================= 工具 ================= */
function rnd(a,b){return a+Math.random()*(b-a);}
function rndi(a,b){return Math.floor(rnd(a,b));}
function box(w,h,d,m,cs=true,rc=true){ const ms=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  ms.castShadow=cs; ms.receiveShadow=rc; return ms; }
function rbox(w,h,d,r,m,cs=true,rc=true){ const ms=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,Math.min(r,h/2.01,d/2.01)),m);
  ms.castShadow=cs; ms.receiveShadow=rc; return ms; }
function plane(w,h,m){ const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m); p.receiveShadow=true; return p; }

/* ---------- 接触阴影（家具落地感） ---------- */
let _csTex=null;
function contactShadowTex(){
  if(_csTex) return _csTex;
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,6,64,64,62);
  gr.addColorStop(0,'rgba(20,12,4,.95)'); gr.addColorStop(.55,'rgba(20,12,4,.42)'); gr.addColorStop(1,'rgba(20,12,4,0)');
  g.fillStyle=gr; g.fillRect(0,0,128,128);
  _csTex=new THREE.CanvasTexture(c); return _csTex;
}
function contactShadow(x,z,w,d,op=.5){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
    new THREE.MeshBasicMaterial({map:contactShadowTex(),transparent:true,opacity:op,depthWrite:false}));
  m.rotation.x=-Math.PI/2; m.position.set(x,.0035+Math.random()*.0008,z);
  m.scale.set(w,d,1); m.renderOrder=2; scene.add(m); return m;
}

/* ---------- 程序化凹凸贴图（灰度，仅作 bumpMap，不影响换色） ---------- */
let TEXB={};
function buildBumpMaps(){
  // 木纹：横向板缝+长纹理
  {const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
   g.fillStyle='#808080'; g.fillRect(0,0,256,256);
   for(let i=0;i<44;i++){ const y=Math.random()*256;
     g.strokeStyle='rgba('+(Math.random()<.5?'52':'168')+','+(Math.random()<.5?'52':'168')+','+(Math.random()<.5?'52':'168')+',.28)';
     g.lineWidth=.6+Math.random()*1.6; g.beginPath(); g.moveTo(0,y);
     g.bezierCurveTo(70,y+rnd(-3,3),170,y+rnd(-3,3),256,y+rnd(-2,2)); g.stroke(); }
   for(let x=40;x<256;x+=70+rnd(-14,14)){ g.fillStyle='rgba(30,30,30,.55)'; g.fillRect(x,0,1.6,256); }
   TEXB.wood=new THREE.CanvasTexture(c);}
  // 木纹竖向
  {const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
   g.translate(128,128); g.rotate(Math.PI/2); g.translate(-128,-128);
   g.drawImage(TEXB.wood.image,0,0); TEXB.woodV=new THREE.CanvasTexture(c);}
  // 皮革颗粒：高频噪声+低频云斑
  {const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
   g.fillStyle='#808080'; g.fillRect(0,0,256,256);
   for(let i=0;i<5200;i++){ const v=rndi(96,160);
     g.fillStyle=`rgba(${v},${v},${v},.5)`; const r=rnd(.6,1.7);
     g.beginPath(); g.arc(Math.random()*256,Math.random()*256,r,0,7); g.fill(); }
   for(let i=0;i<16;i++){ const v=rndi(105,150);
     g.fillStyle=`rgba(${v},${v},${v},.14)`; g.beginPath();
     g.arc(Math.random()*256,Math.random()*256,rnd(18,46),0,7); g.fill(); }
   TEXB.leather=new THREE.CanvasTexture(c);}
  // 织物织纹：细十字网
  {const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
   g.fillStyle='#7e7e7e'; g.fillRect(0,0,128,128);
   for(let y=0;y<128;y+=2)for(let x=0;x<128;x+=2){
     g.fillStyle=((x+y)%4===0)?'#949494':'#6c6c6c'; g.fillRect(x,y,1.15,1.15); }
   TEXB.weave=new THREE.CanvasTexture(c);}
  Object.values(TEXB).forEach(t=>{ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,2); });
  SW.deskW.bumpMap=TEXB.wood;  SW.shelf.bumpMap=TEXB.woodV;
  SW.baySeat.bumpMap=TEXB.wood; SW.rugS.bumpMap=TEXB.weave;
  SW.leather.bumpMap=TEXB.leather; SW.leather.bumpScale=.045;
  SW.cushion.bumpMap=TEXB.weave;  SW.cushion.bumpScale=.03;
  SW.throwM.bumpMap=TEXB.weave;   SW.throwM.bumpScale=.035;
  [SW.deskW,SW.shelf].forEach(m=>m.bumpScale=.022);
}

/* ================= 可点击软装清单 ================= */
const CLICKABLE=[];

function makeSpineTex(style){
  const c=document.createElement('canvas'); c.width=256; c.height=128;
  const g=c.getContext('2d');
  g.fillStyle='#ffffff'; g.fillRect(0,0,256,128);
  for(let i=0;i<800;i++){ g.fillStyle='rgba(110,110,110,.12)';
    g.fillRect(Math.random()*256,Math.random()*128,1.4,1.4); }
  if(style===0){                       // 烫金三道横带+菱徽
    g.fillStyle='rgba(96,76,34,.95)';
    g.fillRect(0,10,256,9); g.fillRect(0,58,256,7); g.fillRect(0,109,256,9);
    g.save(); g.translate(128,64); g.rotate(Math.PI/4);
    g.fillRect(-26,-26,52,52); g.restore();
  }else if(style===1){                 // 端头色带
    g.fillStyle='rgba(46,40,32,.92)';
    g.fillRect(0,0,256,34); g.fillRect(0,94,256,34);
    g.fillStyle='rgba(112,96,66,.92)';
    g.fillRect(22,44,13,40); g.fillRect(216,44,13,40);
  }else{                               // 竖排仿书名
    for(let col=46;col<=210;col+=36){
      let y=14;
      while(y<100){ const h=rnd(9,19);
        g.fillStyle='rgba(48,44,38,.9)';
        g.fillRect(col+rnd(-2,2),y,rnd(9,17),h); y+=h+rnd(3,9); } }
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=8; return t;
}
const BOOKN_MAX = 1500, BK_CAP = Math.ceil(BOOKN_MAX/3);
const shelfGeo=new THREE.BoxGeometry(1,1,1);
const SPINE_T=[0,1,2].map(k=>makeSpineTex(k));
const bookSets=[0,1,2].map(k=>{
  const m=new THREE.InstancedMesh(shelfGeo,
    new THREE.MeshStandardMaterial({color:'#ffffff',roughness:.82,map:SPINE_T[k]}), BK_CAP);
  m.castShadow=true; m.receiveShadow=true; m.count=0; scene.add(m); return m; });
const _bk={set:0,idx:0};
const _m4=new THREE.Matrix4(), _q=new THREE.Quaternion(), _e=new THREE.Euler(), _v=new THREE.Vector3(), _s=new THREE.Vector3(), _c=new THREE.Color();

function buildShelf(){
  let bi=0; const MAT=SW.shelf;   // bi 保留以防后续按需统计
  const Z0=0.32, Z1=5.70, Xc=0.17, D=0.34, Htop=2.72, plinth=0.38;
  const G=new THREE.Group(); scene.add(G);
  // 外框：顶/底/侧
  const sideT=.032;
  [[D,Htop,Z1-Z0+sideT*2,Xc,Htop/2,Z0-sideT/2,true],
  ].forEach(()=>{});
  const add=(w,h,d,x,y,z,m=MAT)=>{const b=box(w,h,d,m); b.position.set(x,y,z); G.add(b); return b;};
  add(D,plinth+.05,Z1-Z0+sideT*2, Xc,(plinth)/2-0.0, (Z0+Z1)/2);            // 底柜体
  add(D,.07,Z1-Z0+sideT*2, Xc,plinth+.035,(Z0+Z1)/2);                        // 台面收口
  add(D,.06,Z1-Z0+sideT*2, Xc,Htop+.03,(Z0+Z1)/2);                           // 顶收口
  add(D,Htop,sideT, Xc,Htop/2,Z0-sideT/2);                                   // 南端板
  add(D,Htop,sideT, Xc,Htop/2,Z1+sideT/2);                                   // 北端板
  add(.05,Htop,Z1-Z0, .025,Htop/2,(Z0+Z1)/2);                                // 背板座
  // 背板(风格色)
  const bp=plane(Z1-Z0+.1,Htop-.02,SW.backP); bp.rotation.y=Math.PI/2;
  bp.position.set(0.052,Htop/2-0.01,(Z0+Z1)/2); G.add(bp);
  // 底柜门板装饰线
  for(let i=0;i<8;i++){ const zc=Z0+ (i+0.5)*(Z1-Z0)/8;
    add(.012,plinth-.14,(Z1-Z0)/8-.09, D+.002,(plinth)/2,zc, SW.trim).castShadow=false;
    const knob=new THREE.Mesh(new THREE.SphereGeometry(.014,8,8),mkMat('#c8a052',{metalness:.9,roughness:.35}));
    knob.position.set(D+.02,plinth/2, zc+(Z1-Z0)/8-.09); G.add(knob); }
  // 层板 y & 竖隔板
  const LV=[0.82,1.19,1.56,1.93,2.30];
  const NBAY=8, bw=(Z1-Z0-NBAY*0.03)/NBAY;
  LV.forEach(y=>add(D,.03,Z1-Z0, Xc,y,(Z0+Z1)/2));
  for(let i=0;i<=NBAY;i++) add(D,Htop-plinth-.05,0.03, Xc,plinth+(Htop-plinth-.05)/2, Z0+i*(bw+0.03));
  // —— 放书 ——
  const PAL=['#8f3b2b','#b3652f','#c9993f','#37584a','#2f4858','#59422c','#e8dcc4','#7b2d26','#96742f','#e0cba8','#a34f2f','#31584a','#d19c3f','#48586e','#6d3530'];
  const JUMP=['#d8a02e','#efe0c2','#4a6fa5','#c05a30','#5a7d54','#7d2f3a'];
  const rowsBottom=[plinth+.065]; LV.forEach(y=>rowsBottom.push(y+.015));
  const rowOpenH=[LV[0]-plinth-.03]; for(let i=0;i<LV.length;i++)
    rowOpenH.push((i<LV.length-1?LV[i+1]:Htop)-LV[i]-.03);
  for(let bIdx=0;bIdx<NBAY;bIdx++){
    const zL=Z0+bIdx*(bw+0.03)+0.03, zR=zL+bw-0.03;
    for(let L=0;L<6;L++){
      const yBot=rowsBottom[L], maxH=rowOpenH[L]*0.92;
      let cursor=zL;
      const forcedDeco=((bIdx===2&&L===2)||(bIdx===5&&L===3)||(bIdx===6&&L===1));
      let roll=Math.random();
      while(cursor<zR-0.07){
        const remain=zR-cursor;
        if(forcedDeco||roll<0.13||remain<0.16){ // 装饰单元
          const kind=Math.random();
          if(kind<0.4){ // 陶瓷罐
            const vscale=rnd(0.1,0.15);
            const vase=new THREE.Mesh(new THREE.SphereGeometry(vscale,10,10),
              mkMat(Math.random()<.5?'#cbb59a':'#7d6a52',{roughness:.6}));
            vase.scale.y=1.35; vase.position.set(Xc+rnd(-.03,.03),yBot+vscale*1.3,cursor+vscale);
            vase.castShadow=true; G.add(vase); cursor+=vscale*2.1;
          }else if(kind<0.75){ // 收纳盒
            const bw2=rnd(.24,.34), bh2=rnd(.14,.22);
            const bxx=add(0.24,bh2,bw2, Xc,yBot+bh2/2,cursor+bw2/2, mkMat(['#9c7a3c','#5d6b5a','#a34f2f'][rndi(0,3)],{roughness:.9}));
            bxx.scale.x=0.98; cursor+=bw2;
          }else{ // 平叠书堆
            const n2=rndi(3,6), dep=rnd(.18,.24);
            let y2=yBot;
            for(let k=0;k<n2;k++){ const hh=rnd(.03,.05);
              placeBookInst(rnd(.19,.26),hh,rnd(.15,.19),Xc+rnd(-.01,.01),y2+hh/2,cursor+dep/2,0);
              y2+=hh; }
            cursor+=dep+0.035;
          }
          roll=Math.random(); continue;
        }
        // 一组直立书
        const gw=Math.min(rnd(.2,.46),remain-0.02);
        const n=Math.max(3,Math.round(gw/rnd(.024,.04)));
        const hBase=rnd(maxH*.55,maxH*.92);
        const gCol=PAL[rndi(0,PAL.length)];
        let lastC=new THREE.Color(gCol);
        for(let k=0;k<n && cursor<zR-0.02;k++){
          const t=rnd(.02,.042);
          const hh=Math.min(hBase*(Math.random()<.25?rnd(.55,.8):rnd(.85,1.05)),maxH);
          let lean=0; if(k===n-1&&Math.random()<.4&&cursor+t*1.6<zR) lean=rnd(.06,.16);
          if(Math.random()<.12){ // 组内跳色点缀
            _c.set(JUMP[rndi(0,JUMP.length)]);
          }else{ lastC.offsetHSL(0,rnd(-.03,.03),rnd(-.06,.06)); _c.copy(lastC); }
          const drop=lean? Math.sin(lean)*t*.5 : 0;
          placeBookInst(rnd(.15,.2),hh,t, Xc+rnd(-.02,.02), yBot+drop+hh/2* Math.cos(lean), cursor+t/2, lean, _c);
          cursor+=t+(lean?0.045:0.004);
        }
        if(Math.random()<.14) cursor+=rnd(.08,.2);   // 偶发留白呼吸感
        cursor+=rnd(.008,.04); roll=Math.random();
      }
    }
  }
  function placeBookInst(dp,hh,t,x,y,z,lean,colorOverride){
    if(_bk.idx>=BK_CAP){ if(_bk.set>=2) return; _bk.set++; _bk.idx=0; }
    const m=bookSets[_bk.set];
    _q.setFromEuler(_e.set(0,0,0));
    if(lean>0){ _e.set(lean,0,0); _q.setFromEuler(_e); }
    _v.set(x,y,z); _s.set(dp,hh,t);
    _m4.compose(_v,_q,_s); m.setMatrixAt(_bk.idx,_m4);
    if(colorOverride) _c.copy(colorOverride); else _c.set(PAL[rndi(0,PAL.length)]);
    m.setColorAt(_bk.idx,_c);
    m.count=_bk.idx+1; _bk.idx++;
  }
  bookSets.forEach(m=>{ m.instanceMatrix.needsUpdate=true;
    if(m.instanceColor) m.instanceColor.needsUpdate=true; tag(m,'SHELF'); });
}

function art(x,y,z,facing,w,h,dom){
  const g=new THREE.Group();
  const fr=box(w+.05,h+.05,.035,SW.deskW); g.add(fr);
  const cv=document.createElement('canvas'); cv.width=256; cv.height=192;
  const gg=cv.getContext('2d');
  gg.fillStyle='#efe6d2'; gg.fillRect(0,0,256,192);
  const cols=[dom,'#37584a','#c8871f','#31584a','#8f3b2b','#e8dcc4'];
  for(let i=0;i<7;i++){ gg.fillStyle=cols[rndi(0,cols.length)];
    gg.globalAlpha=.85;
    if(Math.random()<.5){gg.beginPath();gg.arc(rnd(30,226),rnd(30,162),rnd(14,52),0,7);gg.fill();}
    else gg.fillRect(rnd(20,180),rnd(20,130),rnd(30,90),rnd(24,66)); }
  gg.globalAlpha=1; gg.strokeStyle='#3a2f24'; gg.lineWidth=3; gg.strokeRect(14,14,228,164);
  const tx=new THREE.CanvasTexture(cv); tx.colorSpace=THREE.SRGBColorSpace;
  const pn=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({map:tx,roughness:.9}));
  pn.position.z=.02; g.add(pn);
  g.position.set(x,y,z);
  g.rotation.y = {south:0, east:-Math.PI/2}[facing];
  g.traverse(o=>{if(o.isMesh)o.castShadow=true;});
  tag(g,'PAINTING');
  scene.add(g);
}

function applyEnv(v){
  if(Math.abs(v-lastEnv)<.005) return; lastEnv=v;
  scene.traverse(o=>{ if(o.isMesh&&o.material&&'envMapIntensity' in o.material) o.material.envMapIntensity=v; });
}
const curSunPos=new THREE.Vector3(-5.2,4.9,-7.4), tmpV=new THREE.Vector3();
let tgt=MODES.day;
function applyMode(m){ tgt=MODES[m]; scene.background=BG[m]; }

/* ================= 风格切换 ================= */
function applyPalette(key){
  const P=PALETTES[key];
  SW.wall.color.set(P.wall); SW.trim.color.set(P.trim); SW.ceil.color.set(P.ceil);
  SW.shelf.color.set(P.shelf); SW.backP.color.set(P.backP); SW.deskW.color.set(P.desk);
  SW.leather.color.set(P.leather); SW.cushion.color.set(P.cushion);
  SW.throwM.color.set(P.throw); SW.rugS.color.set(P.rugS);
  SW.pil.forEach((m,i)=>m.color.set(P.pillows[i])); SW.baySeat.color.set(P.baySeat);
  drawFloor(P.floor); drawRug(P.rug,P.rugInk);
}

/* ================= 视角预设 ================= */
const VIEWS={
 overview:{p:[6.0,3.0,7.6],t:[2.45,1.05,1.9]},
 desk:{p:[2.7,1.5,3.3],t:[2.45,0.82,1.5]},
 shelf:{p:[3.6,1.5,3.0],t:[0.35,1.3,3.0]},
 window:{p:[2.5,1.35,2.9],t:[2.5,0.75,-0.4]},
 plan:{p:[2.5,9.6,3.05],t:[2.5,0,2.98]} };
let tween=null;
function goView(k,instant){
  const v=VIEWS[k]; if(!v)return;
  document.querySelectorAll('#viewBar .pill').forEach(b=>b.classList.toggle('on',b.dataset.v===k));
  if(instant){ camera.position.set(...v.p); controls.target.set(...v.t); controls.update(); return;}
  tween={t:0,p0:camera.position.clone(),t0:controls.target.clone(),
         p1:new THREE.Vector3(...v.p),t1:new THREE.Vector3(...v.t)};
}

/* ================= UI 绑定 ================= */
document.getElementById('timeBtns').addEventListener('click',e=>{
  const b=e.target.closest('.pill'); if(!b)return;
  document.querySelectorAll('#timeBtns .pill').forEach(x=>x.classList.toggle('on',x===b));
  applyMode(b.dataset.t); });
document.getElementById('styleBtns').addEventListener('click',e=>{
  const b=e.target.closest('.pill'); if(!b)return;
  document.querySelectorAll('#styleBtns .pill').forEach(x=>x.classList.toggle('on',x===b));
  applyPalette(b.dataset.s); });
document.getElementById('viewBar').addEventListener('click',e=>{
  const b=e.target.closest('.pill'); if(b) goView(b.dataset.v); });
let dimsOn=true;
document.getElementById('dimBtn').addEventListener('click',()=>{
  dimsOn=!dimsOn; dimGroup.visible=dimsOn;
  if(dimsOn) ensureDimDom();
  if(dimWrap) dimWrap.style.display = (dimsOn?'block':'none');
  document.getElementById('dimBtn').textContent=dimsOn?'开 启':'隐 藏';
  document.getElementById('dimBtn').classList.toggle('on',dimsOn); });

/* 尺寸标注线（WebGL红线）+ DOM 文字标签（project 到屏幕层，稳定清晰） */
const dimGroup=new THREE.Group(); scene.add(dimGroup);
const DIMS=[]; let dimWrap=null;
function dimLine(a,b,label){
  const va=new THREE.Vector3(...a), vb=new THREE.Vector3(...b);
  const g=new THREE.BufferGeometry().setFromPoints([va,vb]);
  const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:'#c8402a'})); dimGroup.add(l);
  DIMS.push({m:va.clone().lerp(vb,.5), el:null, txt:label});
}
function ensureDimDom(){
  if(dimWrap) return;
  dimWrap=document.createElement('div');
  dimWrap.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:8;display:none';
  document.body.appendChild(dimWrap);
  DIMS.forEach(d=>{
    const el=document.createElement('div'); el.className='taglab'; el.textContent=d.txt;
    d.el=el; dimWrap.appendChild(el); });
}

function buildDims(){
  const y=0.02, off=0.55;
  dimLine([off, y, -0.02],[ROOM_W-off,y,-0.02],'面宽 5.0m');
  dimLine([ROOM_W+0.04,y,off],[ROOM_W+0.04,y,ROOM_D-off],'进深 6.0m');
  dimLine([1.3,y,-0.72],[3.7,y,-0.72],'凸窗 2.4m');
  dimLine([0.42,y,0.32],[0.42,y,5.7],'书架墙 5.4m');
  dimLine([1.6,y,1.3],[3.4,y,2.15],'书桌 1.8m');
}
buildDims();

/* ================= 组装 ================= */
buildBumpMaps();
makeOutside();
buildShelf();
desk();
leisureCorner();
greenery();
credenza();
lightingFixtures();
mainRug();
applyPalette('A');
/* 接触阴影：家具落地感 */
[[2.5,1.72,2.5,1.3,.55],[2.5,2.62,1.0,1.0,.6],[4.25,1.05,1.45,1.45,.62],
 [4.68,.38,.75,.75,.45],[.66,5.28,1.15,1.15,.55],[4.42,.52,.95,.95,.5],
 [.7,1.3,.7,.7,.42],[5.79,4.0,1.55,.8,.55],[2.0,5.72,1.35,.7,.5]].forEach(a=>contactShadow(...a));

/* URL 参数直出（供截图QA） */
const qs=new URLSearchParams(location.search);
if(qs.get('noui')==='1'){ document.querySelectorAll('.card,#hint,#loading').forEach(el=>el.style.display='none');
  dimsOn=false; dimGroup.visible=false; }if(qs.get('time')){ applyMode(qs.get('time'));
  document.querySelectorAll('#timeBtns .pill').forEach(x=>x.classList.toggle('on',x.dataset.t===qs.get('time'))); }
if(qs.get('style')){ applyPalette(qs.get('style'));
  document.querySelectorAll('#styleBtns .pill').forEach(x=>x.classList.toggle('on',x.dataset.s===qs.get('style'))); }
if(qs.get('view')) goView(qs.get('view'),true);
/* 自由机位: ?cam=x,y,z&tgt=x,y,z （供QA与分享指定视角） */
if(qs.get('cam')){ const c=qs.get('cam').split(',').map(Number);
  camera.position.set(c[0],c[1],c[2]);
  const t=qs.get('tgt')? qs.get('tgt').split(',').map(Number) : [2.5,.7,2.5];
  controls.target.set(t[0],t[1],t[2]); controls.update(); }
if(qs.get('nodim')==='1'){ dimsOn=false; dimGroup.visible=false; document.getElementById('dimBtn').classList.remove('on'); document.getElementById('dimBtn').textContent='隐 藏';}

/* ================= 点击家具 → 软装清单弹层 ================= */
const raycaster=new THREE.Raycaster(), ptr=new THREE.Vector2();
let downXY=null;
renderer.domElement.addEventListener('pointerdown',e=>{ downXY=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downXY) return;
  const dx=e.clientX-downXY[0], dy=e.clientY-downXY[1]; downXY=null;
  if(dx*dx+dy*dy>36) return;                       // 拖拽不算点击
  ptr.x=(e.clientX/innerWidth)*2-1; ptr.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(ptr,camera);
  const hits=raycaster.intersectObjects(CLICKABLE,true);
  for(const h of hits){ let o=h.object;
    while(o && !(o.userData&&o.userData.info)) o=o.parent;
    if(o && o.userData.info){ showPop(o.userData.info,e.clientX,e.clientY,o); return; } }
  hidePop();
});
let hoverN=0;
renderer.domElement.addEventListener('pointermove',e=>{
  if(++hoverN%3 || tween) return;                  // 节流；相机动画中跳过
  ptr.x=(e.clientX/innerWidth)*2-1; ptr.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(ptr,camera);
  renderer.domElement.style.cursor = raycaster.intersectObjects(CLICKABLE,true).length ? 'pointer' : '';
});
function showPop(info,x,y,obj){
  document.getElementById('pcName').textContent=info.name;
  document.getElementById('pcSpec').textContent=info.spec;
  document.getElementById('pcMat').textContent=info.mat;
  document.getElementById('pcPrice').innerHTML='<b>'+info.price+'</b>';
  document.getElementById('pcTip').textContent='◆ '+info.tip;
  const pc=document.getElementById('popCard');
  pc.classList.add('show');
  requestAnimationFrame(()=>{
    const w=pc.offsetWidth, h=pc.offsetHeight;
    let px=x+18, py=y-h-14; if(py<12) py=y+18;
    if(px+w>innerWidth-10) px=x-w-18; if(px<10) px=10;
    pc.style.left=px+'px'; pc.style.top=py+'px';
  });
  pingAt(obj);
}
window.hidePop=function(){ document.getElementById('popCard').classList.remove('show'); };
addEventListener('keydown',e=>{ if(e.key==='Escape') window.hidePop(); });
function pingAt(obj){
  const bb=new THREE.Box3().setFromObject(obj);
  if(bb.isEmpty()) return;
  const c=bb.getCenter(new THREE.Vector3()); c.project(camera);
  if(c.z>=1||c.z<-1) return;
  const d=document.createElement('div'); d.className='ping';
  d.style.left=((c.x*.5+.5)*innerWidth)+'px';
  d.style.top =((-c.y*.5+.5)*innerHeight)+'px';
  document.body.appendChild(d); setTimeout(()=>d.remove(),750);
}
/* autoclick=<KEY> 演示模式：自动弹出某件家具的清单卡 */
if(qs.get('autoclick')){
  const key=qs.get('autoclick').toUpperCase();
  setTimeout(()=>{
    const obj=CLICKABLE.find(o=>o.userData.ikey===key);
    if(obj&&obj.userData.info) showPop(obj.userData.info, innerWidth*.64, innerHeight*.58, obj);
  }, 400);
}
/* DOM 尺寸标签初始化 */
ensureDimDom();
if(dimWrap) dimWrap.style.display=dimsOn?'block':'none';

/* ================= 渲染循环 ================= */
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
const clock=new THREE.Clock();
let firstFrame=true;
function loop(){
  requestAnimationFrame(loop);
  const k=1-Math.pow(0.0018, clock.getDelta()/8);   // 平滑阻尼
  ['sun','hemi','amb','pend','flamp','banker','shelfF','globeEm','trackEm','bayGlow','env'].forEach(key=>{
    cur[key]+= (tgt[key]-cur[key])*Math.min(1,k*1.4); });
  applyEnv(cur.env);
  sun.intensity=cur.sun; sun.color.set(tgt.sunColor);
  curSunPos.lerp(tmpV.fromArray(tgt.sunPos), Math.min(1,k*1.2));
  sun.position.copy(curSunPos);
  hemi.intensity=cur.hemi; fill.intensity=cur.amb;
  pendantL.intensity=cur.pend; floorL.intensity=cur.flamp; bankerL.intensity=cur.banker;
  shelfL1.intensity=shelfL2.intensity=cur.shelfF;
  bayL.intensity=cur.bayGlow;
  const gl=window.__pend?.getObjectByName('pendantGlobe');
  if(gl) gl.material.emissiveIntensity=cur.globeEm;
  scene.getObjectByName('trackDot') &&
    scene.traverse(o=>{ if(o.name==='trackDot'||o.name==='downDot') o.material.emissiveIntensity=cur.trackEm; });
  window.__flamp && window.__flamp.traverse(o=>{
    if(o.isMesh&&o.material.name==='lampShade'){ o.material.emissive.set('#ffbe6e'); o.material.emissiveIntensity=cur.trackEm*.55; }});
  renderer.toneMappingExposure += (tgt.exposure-renderer.toneMappingExposure)*.08;
  if(window.__flame) window.__flame.material.emissiveIntensity =
    .1 + cur.trackEm*.9 + Math.sin(performance.now()*.013)*.07*cur.trackEm;   // 烛光摇曳

  if(tween){ tween.t+=clock.getDelta()*0 + 1/60*1.4; const e=ease(Math.min(1,tween.t));
    camera.position.lerpVectors(tween.p0,tween.p1,e);
    controls.target.lerpVectors(tween.t0,tween.t1,e);
    if(tween.t>=1) tween=null; }
  /* DOM 尺寸标签跟随投影 */
  if(dimsOn&&dimWrap){
    DIMS.forEach(d=>{ tmpV.copy(d.m).project(camera);
      if(tmpV.z<-1||tmpV.z>1){ d.el.style.display='none'; return; }
      d.el.style.display='block';
      d.el.style.left=((tmpV.x*.5+.5)*innerWidth)+'px';
      d.el.style.top =((-tmpV.y*.5+.5)*innerHeight)+'px'; }); }
  controls.update();
  renderer.render(scene,camera);
  if(firstFrame){ firstFrame=false;
    document.getElementById('loading').style.display='none';
    window.__ready=true; }
}
loop();
window.__setViewInstant=(k)=>goView(k,true);
</script>
</body>
