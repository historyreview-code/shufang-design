server {
    listen 80;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    location ~* \.(jpg|png|glb)$ { add_header Cache-Control "no-cache, must-revalidate"; }
    location / { add_header Cache-Control "no-cache, must-revalidate"; try_files $uri $uri/ =404; }
}
